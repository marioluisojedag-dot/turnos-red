$kind: http-request
url: "{{baseUrl}}/medicos"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is an array\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Response matches JSON structure\", function () {\r

      \    const jsonData = pm.response.json();\r

      \r

      \    pm.expect(jsonData).to.be.an(\"array\");\r

      \r

      \    jsonData.forEach((medico) => {\r

      \        pm.expect(medico).to.be.an(\"object\");\r

      \r

      \        pm.expect(medico.id).to.be.a(\"number\");\r

      \        pm.expect(medico.nombre).to.be.a(\"string\");\r

      \        pm.expect(medico.especialidad).to.be.a(\"string\");\r

      \        pm.expect(medico.disponible).to.be.a(\"boolean\");\r

      \    });\r

      });"
    language: text/javascript
examples: .resources/Listar medicos.resources/examples
order: 4480516506827948
