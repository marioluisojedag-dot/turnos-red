$kind: http-request
url: "{{baseUrl}}/turnos/{{turnoId}}"
method: PUT
body:
  type: json
  content: "{\r

    \  \"id\": \"10\",\r

    \  \"paciente\": \"Ana Pérez Actualizada\",\r

    \  \"documento\": \"12345678\",\r

    \  \"especialidad\": \"Pediatría\",\r

    \  \"fecha\": \"31/08/2026\",\r

    \  \"hora\": \"11:00\",\r

    \  \"confirmado\": \"no\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const jsonData = pm.response.json();\r

      \r

      pm.test(\"Response has turno id\", function () {\r

      \    pm.expect(jsonData).to.have.property(\"id\");\r

      });\r

      \r

      pm.test(\"Turno id matches saved variable\", function () {\r

      \    pm.expect(jsonData.id).to.eql(\r

      \        Number(pm.environment.get(\"turnoId\"))\r

      \    );\r

      });\r

      \r

      pm.test(\"Turno has required fields\", function () {\r

      \    pm.expect(jsonData).to.have.property(\"id\");\r

      \    pm.expect(jsonData).to.have.property(\"paciente\");\r

      \    pm.expect(jsonData).to.have.property(\"documento\");\r

      \    pm.expect(jsonData).to.have.property(\"especialidad\");\r

      \    pm.expect(jsonData).to.have.property(\"medicoId\");\r

      \    pm.expect(jsonData).to.have.property(\"fecha\");\r

      \    pm.expect(jsonData).to.have.property(\"hora\");\r

      \    pm.expect(jsonData).to.have.property(\"confirmado\");\r

      });"
    language: text/javascript
examples: .resources/Actualizar turno.resources/examples
